<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Komet</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        color: #111;
        font:
          13px/1.5 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #fff;
      }

      form {
        display: grid;
        gap: 8px;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 9px 10px;
        border: 1px solid #d4d4d4;
        border-radius: 4px;
        font: inherit;
      }

      button {
        padding: 9px 10px;
        border: 0;
        border-radius: 4px;
        color: #fff;
        font: inherit;
        font-weight: 700;
        background: #222;
        cursor: pointer;
      }

      pre {
        min-height: 72px;
        max-height: 140px;
        margin: 10px 0 0;
        padding: 8px;
        overflow: auto;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        color: #555;
        font:
          12px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        white-space: pre-wrap;
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <form id="settingsForm">
      <input
        id="urlInput"
        type="text"
        placeholder="wss://xxxx.trycloudflare.com/ws/host"
        autocomplete="off"
      />
      <button type="submit">保存</button>
    </form>
    <pre id="logOutput" aria-live="polite"></pre>
    <script src="popup.js"></script>
  </body>
</html>
