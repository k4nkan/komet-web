<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Komet Host</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/host/host.css" />
  </head>
  <body class="host-body">
    <main class="host-stage" aria-label="Comment host">
      <section class="host-panel" id="hostPanel">
        <div class="panel-row">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">接続中</span>
        </div>
        <div class="panel-field">
          <span>Client URL</span>
          <strong id="clientUrl">loading...</strong>
        </div>
        <div class="panel-field">
          <span>保存先</span>
          <strong id="dbStatus">SQLite</strong>
        </div>
        <button class="panel-button" id="hidePanel" type="button">隠す</button>
      </section>
      <button
        class="panel-toggle"
        id="showPanel"
        type="button"
        aria-label="パネルを表示"
      >
        i
      </button>
      <div class="comment-layer" id="commentLayer" aria-live="polite"></div>
    </main>
    <script src="/host/host.js" type="module"></script>
  </body>
</html>
