<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Komet</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/client/client.css" />
  </head>
  <body class="client-body">
    <main class="client-shell">
      <section class="post-card">
        <form id="commentForm" autocomplete="off">
          <textarea
            id="textInput"
            name="text"
            rows="4"
            maxlength="80"
            required
            placeholder="コメントを書く"
          ></textarea>

          <div class="color-row" id="colorRow" aria-label="Color"></div>

          <button class="submit-button" type="submit">送信</button>
        </form>
      </section>
    </main>
    <script src="/client/client.js" type="module"></script>
  </body>
</html>
