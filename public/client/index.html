<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Komet Client</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/client/client.css" />
  </head>
  <body class="client-body">
    <main class="client-shell">
      <section class="post-card">
        <div class="post-heading">
          <h1>Komet Client</h1>
          <span class="status-pill" id="formStatus">ready</span>
        </div>
        <form id="commentForm" autocomplete="off">
          <label class="field-label" for="nameInput">Name</label>
          <input
            id="nameInput"
            name="name"
            maxlength="24"
            placeholder="anonymous"
          />

          <label class="field-label" for="textInput">Comment</label>
          <textarea
            id="textInput"
            name="text"
            rows="4"
            maxlength="80"
            required
            placeholder="コメントを書く"
          ></textarea>

          <div class="color-row" id="colorRow" aria-label="Color"></div>

          <button class="submit-button" type="submit">送信</button>
        </form>
      </section>
    </main>
    <script src="/client/client.js" type="module"></script>
  </body>
</html>
